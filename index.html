<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>MrCrazy Digital Hub</title>
<link rel="icon" href="assets/Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090f;
  --card:rgba(16,20,32,.82);
  --stroke:rgba(255,255,255,.10);
  --text:#f4f6fb;
  --muted:#9aa3b5;
  --accent:#6ee7ff;
  --accent2:#a78bfa;
  --ok:#34d399;
  --err:#f87171;
  --gold:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}

/* Background video */
.bg-video{
  position:fixed;inset:0;width:100%;height:100%;
  object-fit:cover;z-index:0;
  pointer-events:none;
  filter:brightness(.38) saturate(1.1);
}
.bg-overlay{
  position:fixed;inset:0;z-index:1;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(110,231,255,.18), transparent 55%),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(167,139,250,.14), transparent 50%),
    linear-gradient(180deg, rgba(7,9,15,.55) 0%, rgba(7,9,15,.82) 100%);
  pointer-events:none;
}

/* Loading screen */
#loader{
  position:fixed;inset:0;z-index:100;
  background:#07090f;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .55s ease, visibility .55s ease;
}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none;}
.loader-ring{
  width:72px;height:72px;border-radius:50%;
  border:3px solid rgba(255,255,255,.08);
  border-top-color:var(--accent);
  border-right-color:var(--accent2);
  animation:spin 0.9s linear infinite;
  margin-bottom:18px;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loader-text{
  font-family:'Space Grotesk',sans-serif;
  font-size:13px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);
}
.loader-bar{
  width:120px;height:3px;background:rgba(255,255,255,.08);
  border-radius:99px;margin-top:14px;overflow:hidden;
}
.loader-bar > i{
  display:block;height:100%;width:0%;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:99px;
  animation:loadBar 1.6s ease-in-out forwards;
}
@keyframes loadBar{0%{width:0%}100%{width:100%}}

/* Main */
.wrap{
  position:relative;z-index:2;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 18px 36px;
  opacity:0;transform:translateY(12px);
  transition:opacity .6s ease .15s, transform .6s ease .15s;
}
.wrap.show{opacity:1;transform:translateY(0);}

.panel{
  width:100%;max-width:380px;
  background:var(--card);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--stroke);
  border-radius:24px;
  padding:32px 24px 22px;
  box-shadow:0 24px 60px rgba(0,0,0,.45);
  text-align:center;
}

/* Logo circle */
.logo-wrap{
  width:108px;height:108px;margin:0 auto 18px;
  border-radius:50%;
  padding:3px;
  background:linear-gradient(135deg, var(--accent), var(--accent2), var(--gold));
  box-shadow:0 0 0 6px rgba(110,231,255,.08), 0 12px 32px rgba(0,0,0,.35);
  animation:pulseRing 3s ease-in-out infinite;
}
@keyframes pulseRing{
  0%,100%{box-shadow:0 0 0 6px rgba(110,231,255,.08), 0 12px 32px rgba(0,0,0,.35);}
  50%{box-shadow:0 0 0 10px rgba(167,139,250,.12), 0 12px 36px rgba(0,0,0,.4);}
}
.logo-inner{
  width:100%;height:100%;border-radius:50%;
  background:#0c101a;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.logo-inner img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.logo-fallback{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;font-size:28px;color:var(--accent);
}

.brand{
  font-family:'Space Grotesk',sans-serif;
  font-size:22px;font-weight:700;letter-spacing:-.02em;
  margin:0 0 4px;line-height:1.25;
}
.tag{
  font-size:12px;font-weight:600;color:var(--muted);
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:22px;
}

/* Buttons */
.btn{
  width:100%;border:none;border-radius:14px;padding:15px 16px;
  font-size:14.5px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .15s ease, opacity .2s, box-shadow .2s;
  font-family:'Inter',sans-serif;
}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.6;pointer-events:none;}
.btn-primary{
  background:linear-gradient(135deg, #22d3ee 0%, #818cf8 55%, #a78bfa 100%);
  color:#06080f;
  box-shadow:0 10px 28px -8px rgba(110,231,255,.45);
  margin-bottom:10px;
}
.btn-ghost{
  background:rgba(255,255,255,.04);
  border:1px solid var(--stroke);
  color:var(--text);
}
.btn-ghost:active{background:rgba(255,255,255,.08);}

.size-hint{
  font-size:12px;color:var(--muted);margin:8px 0 4px;min-height:16px;
}
.size-hint.ready{color:var(--ok);font-weight:600;}
.size-hint.error{color:var(--err);font-weight:600;}

/* Progress */
.progress-wrap{display:none;margin:14px 0 6px;text-align:left;}
.progress-wrap.active{display:block;}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.pct{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;color:var(--text);line-height:1;}
.pct small{font-size:13px;color:var(--muted);font-weight:500;}
.speed{font-size:11.5px;font-weight:600;color:var(--accent);font-family:'IBM Plex Mono',monospace;}
.bar-bg{width:100%;height:10px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;}
.bar-fill{
  height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg, var(--accent), var(--accent2));
  transition:width .12s ease-out;position:relative;
}
.bar-fill::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
  animation:shimmer 1.1s infinite;
}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.mb-row{
  display:flex;justify-content:space-between;margin-top:7px;
  font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;
}
.status-line{margin-top:9px;font-size:12px;font-weight:600;text-align:center;min-height:16px;color:var(--muted);}
.status-line.error{color:var(--err);}
.status-line.done{color:var(--ok);}

.divider{height:1px;background:var(--stroke);margin:18px 0 14px;}
.dev{
  font-size:11px;color:var(--muted);letter-spacing:.04em;
  line-height:1.5;
}
.dev strong{color:var(--text);font-weight:700;}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);
  background:rgba(12,16,26,.95);color:#fff;padding:11px 16px;border-radius:999px;
  font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;
  z-index:50;border:1px solid var(--stroke);max-width:88%;text-align:center;
  box-shadow:0 10px 28px rgba(0,0,0,.4);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{border-color:rgba(248,113,113,.45);}

/* Mute tip for audio (browsers block autoplay sound) */
.audio-tip{
  position:fixed;top:14px;right:14px;z-index:20;
  background:rgba(12,16,26,.85);border:1px solid var(--stroke);
  color:var(--muted);font-size:11px;font-weight:600;
  padding:7px 12px;border-radius:999px;cursor:pointer;
  backdrop-filter:blur(8px);display:none;
}
.audio-tip.show{display:block;}
</style>
</head>
<body>

<!-- Loader -->
<div id="loader">
  <div class="loader-ring"></div>
  <div class="loader-text">MrCrazy Digital Hub</div>
  <div class="loader-bar"><i></i></div>
</div>

<!-- Background video (no controls, no click) -->
<video class="bg-video" id="bgVideo" autoplay muted loop playsinline preload="auto">
  <source src="assets/Hub.mp4" type="video/mp4">
</video>
<div class="bg-overlay"></div>

<!-- Audio -->
<audio id="bgAudio" loop preload="auto">
  <source src="assets/Hub.mp3" type="audio/mpeg">
</audio>
<button class="audio-tip" id="audioTip" type="button">🔊 Tap for sound</button>

<div class="wrap" id="mainWrap">
  <div class="panel">
    <div class="logo-wrap">
      <div class="logo-inner">
        <img id="logoImg" src="assets/Logo.png" alt="Logo" onerror="this.style.display='none';document.getElementById('logoFb').style.display='flex'">
        <div class="logo-fallback" id="logoFb" style="display:none;width:100%;height:100%;align-items:center;justify-content:center;">MC</div>
      </div>
    </div>

    <h1 class="brand">MrCrazy Digital Hub</h1>
    <p class="tag">Official Android App</p>

    <button class="btn btn-primary" id="downloadBtn" onclick="startDownload()">
      <span>⬇️</span>
      <span id="btnText">Download Android App</span>
    </button>
    <div class="size-hint" id="sizeHint">Checking file…</div>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-top">
        <div class="pct"><span id="pctNum">0</span><small>%</small></div>
        <div class="speed" id="speedText">0 KB/s</div>
      </div>
      <div class="bar-bg"><div class="bar-fill" id="barFill"></div></div>
      <div class="mb-row">
        <span id="loadedText">0 MB</span>
        <span id="totalText">— MB</span>
      </div>
      <div class="status-line" id="statusLine">Preparing download…</div>
    </div>

    <button class="btn btn-ghost" id="webBtn" onclick="window.open('https://mrcrazydev.netlify.app/','_blank','noopener')">
      <span>🌐</span>
      <span>Visit Website</span>
    </button>

    <div class="divider"></div>
    <p class="dev">Developer <strong>MUHAMMAD NAEEM</strong></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const APK_PATHS = [
  "assets/MrCrazy Digital Hub.apk",
  "assets/MrCrazy%20Digital%20Hub.apk",
  "assets/MrCrazyDigitalHub.apk",
  "assets/MrCrazy_Digital_Hub.apk",
  "MrCrazy Digital Hub.apk",
  "MrCrazyDigitalHub.apk"
];

const $ = (id) => document.getElementById(id);
let foundApk = null;
let downloading = false;

function showToast(msg, isError){
  const t = $("toast");
  t.textContent = msg;
  t.classList.toggle("error", !!isError);
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), 3200);
}

function formatBytes(bytes){
  if(!bytes || bytes < 0) return "0 MB";
  const mb = bytes / (1024 * 1024);
  if(mb >= 100) return mb.toFixed(0) + " MB";
  if(mb >= 10) return mb.toFixed(1) + " MB";
  if(mb >= 1) return mb.toFixed(2) + " MB";
  const kb = bytes / 1024;
  return kb >= 1 ? kb.toFixed(0) + " KB" : bytes + " B";
}

function formatSpeed(bps){
  if(!bps || bps < 0) return "0 KB/s";
  const mb = bps / (1024 * 1024);
  if(mb >= 1) return mb.toFixed(2) + " MB/s";
  return (bps / 1024).toFixed(0) + " KB/s";
}

/* Loader + media */
window.addEventListener("load", () => {
  setTimeout(() => {
    $("loader").classList.add("hide");
    $("mainWrap").classList.add("show");
    tryStartMedia();
  }, 1700);
});

function tryStartMedia(){
  const vid = $("bgVideo");
  const aud = $("bgAudio");
  vid.play().catch(()=>{});
  // Audio often blocked until gesture
  aud.volume = 0.55;
  const p = aud.play();
  if(p !== undefined){
    p.then(() => {
      $("audioTip").classList.remove("show");
    }).catch(() => {
      $("audioTip").classList.add("show");
    });
  }
}

$("audioTip").addEventListener("click", () => {
  const aud = $("bgAudio");
  aud.play().then(() => {
    $("audioTip").classList.remove("show");
  }).catch(()=>{});
});

// Also unlock audio on first tap anywhere
document.body.addEventListener("click", function once(){
  const aud = $("bgAudio");
  if(aud.paused){
    aud.play().then(() => $("audioTip").classList.remove("show")).catch(()=>{});
  }
  document.body.removeEventListener("click", once);
}, { passive: true });

async function detectApk(){
  const hint = $("sizeHint");
  const btn = $("downloadBtn");
  btn.disabled = true;
  hint.textContent = "Checking file…";
  hint.className = "size-hint";

  for(const path of APK_PATHS){
    try{
      const res = await fetch(path, { method: "HEAD", cache: "no-store" });
      if(res.ok){
        const len = res.headers.get("Content-Length");
        const size = len ? Number(len) : 0;
        foundApk = { url: path, size };
        readyUI(size);
        return;
      }
    }catch(e){}
  }

  for(const path of APK_PATHS){
    try{
      const res = await fetch(path, {
        method: "GET",
        headers: { "Range": "bytes=0-0" },
        cache: "no-store"
      });
      if(res.ok || res.status === 206){
        let size = 0;
        const range = res.headers.get("Content-Range");
        if(range){ const m = range.match(/\/(\d+)$/); if(m) size = Number(m[1]); }
        else { const len = res.headers.get("Content-Length"); if(len) size = Number(len); }
        foundApk = { url: path, size };
        readyUI(size);
        return;
      }
    }catch(e){}
  }

  foundApk = null;
  hint.textContent = "APK not found in assets";
  hint.className = "size-hint error";
  btn.disabled = false;
  $("btnText").textContent = "Download Android App";
}

function readyUI(size){
  const hint = $("sizeHint");
  hint.textContent = size ? ("Ready · " + formatBytes(size)) : "Ready to download";
  hint.className = "size-hint ready";
  $("downloadBtn").disabled = false;
  $("btnText").textContent = size ? ("Download · " + formatBytes(size)) : "Download Android App";
}

function setProgress(pct, loaded, total, speed){
  const p = Math.max(0, Math.min(100, Math.floor(pct)));
  $("pctNum").textContent = p;
  $("barFill").style.width = p + "%";
  $("loadedText").textContent = formatBytes(loaded);
  $("totalText").textContent = total > 0 ? formatBytes(total) : "— MB";
  $("speedText").textContent = formatSpeed(speed);
}

async function startDownload(){
  if(downloading) return;
  if(!foundApk){
    showToast("Error: APK assets mein nahi mili", true);
    $("sizeHint").textContent = "Upload assets/MrCrazy Digital Hub.apk";
    $("sizeHint").className = "size-hint error";
    return;
  }

  downloading = true;
  const btn = $("downloadBtn");
  btn.disabled = true;
  $("btnText").textContent = "Downloading…";
  $("sizeHint").style.display = "none";
  $("progressWrap").classList.add("active");
  $("statusLine").textContent = "Connecting…";
  $("statusLine").className = "status-line";
  setProgress(0, 0, foundApk.size || 0, 0);

  const startTime = Date.now();
  let lastLoaded = 0, lastTime = startTime;

  try{
    const res = await fetch(foundApk.url, { cache: "no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status);

    const total = Number(res.headers.get("Content-Length")) || foundApk.size || 0;
    if(total) foundApk.size = total;

    if(!res.body || !res.body.getReader){
      $("statusLine").textContent = "Downloading file…";
      const blob = await res.blob();
      setProgress(100, blob.size, blob.size, 0);
      saveBlob(blob);
      finishOk(blob.size);
      return;
    }

    const reader = res.body.getReader();
    const chunks = [];
    let loaded = 0;
    $("statusLine").textContent = "Downloading…";

    while(true){
      const { done, value } = await reader.read();
      if(done) break;
      chunks.push(value);
      loaded += value.length;

      const now = Date.now();
      const dt = (now - lastTime) / 1000;
      let speed = 0;
      if(dt >= 0.15){
        speed = (loaded - lastLoaded) / dt;
        lastLoaded = loaded;
        lastTime = now;
      } else {
        const totalDt = (now - startTime) / 1000;
        speed = totalDt > 0 ? loaded / totalDt : 0;
      }

      const pct = total > 0 ? (loaded / total) * 100 : 0;
      setProgress(pct, loaded, total, speed);
    }

    setProgress(100, loaded, total || loaded, 0);
    $("statusLine").textContent = "Saving file…";
    const blob = new Blob(chunks, { type: "application/vnd.android.package-archive" });
    saveBlob(blob);
    finishOk(loaded);

  }catch(err){
    console.error(err);
    $("statusLine").textContent = "Download failed — try again";
    $("statusLine").className = "status-line error";
    showToast("Download error: file not reachable", true);
    btn.disabled = false;
    $("btnText").textContent = foundApk.size ? ("Download · " + formatBytes(foundApk.size)) : "Download Android App";
    $("sizeHint").style.display = "block";
    downloading = false;
  }
}

function saveBlob(blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "MrCrazy Digital Hub.apk";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function finishOk(bytes){
  $("statusLine").textContent = "✓ Download complete · " + formatBytes(bytes);
  $("statusLine").className = "status-line done";
  $("speedText").textContent = "Done";
  showToast("App downloaded successfully!");
  $("downloadBtn").disabled = false;
  $("btnText").textContent = "Download Again";
  downloading = false;
}

detectApk();
</script>
</body>
</html>
